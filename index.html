<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChombieWombie Tracklist Studio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/midi-writer-js/browser/midiwriter.js"></script>
</head>
<body>
    <div id="drop-overlay">
        <h1 style="color: var(--accent);">DROP AUDIO OR CUE FILE</h1>
    </div>

    <div id="loading-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; gap: 1rem;">
        <div class="spinner"></div>
        <div id="loading-text" style="color: var(--accent); font-family: var(--font-data); font-size: 0.9rem; text-transform: uppercase;">Processing...</div>
    </div>

    <div class="app-container">
        <header>
            <div class="logo">ChombieWombie // Tracklist Studio</div>
            <div class="flex-row">
                <div class="dropdown">
                    <button class="btn btn-accent dropdown-toggle">Export Suite <i data-lucide="chevron-down"></i></button>
                    <div class="dropdown-menu">
                        <button id="copy-yt-btn" class="dropdown-item"><i data-lucide="copy"></i> Copy YT Chapters</button>
                        <button id="download-vs2-btn" class="dropdown-item"><i data-lucide="download"></i> Download VS2 Playlist</button>
                        <div class="dropdown-divider"></div>
                        <button id="extract-midi-btn" class="dropdown-item"><i data-lucide="zap"></i> Extract MIDI Rhythm</button>
                        <button id="download-midi-btn" class="dropdown-item" style="display: none;"><i data-lucide="download"></i> Download .mid</button>
                        <div class="dropdown-divider"></div>
                        <button id="reset-btn" class="dropdown-item" style="color: var(--danger);"><i data-lucide="refresh-cw"></i> Reset Studio</button>
                    </div>
                </div>
                <button id="load-audio-btn" class="btn">Load Audio</button>
                <button id="load-cue-btn" class="btn">Load CUE</button>
            </div>
        </header>

        <main>
            <!-- Setup View: Large Drop Targets -->
            <div id="setup-view" style="display: flex; gap: 1rem; height: 100%;">
                <div class="drop-card" id="audio-drop-card" style="flex: 1; border: 2px dashed var(--border); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1rem; background: var(--bg-panel); cursor: pointer;">
                    <i data-lucide="music" style="width: 48px; height: 48px; color: var(--accent);"></i>
                    <div style="text-align: center;">
                        <div style="font-weight: 700; text-transform: uppercase;">Drop Mix Audio</div>
                        <div style="font-size: 0.7rem; color: var(--text-dim);">MP3, WAV, FLAC</div>
                    </div>
                </div>
                <div class="drop-card" id="cue-drop-card" style="flex: 1; border: 2px dashed var(--border); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1rem; background: var(--bg-panel); cursor: pointer;">
                    <i data-lucide="file-text" style="width: 48px; height: 48px; color: var(--accent);"></i>
                    <div style="text-align: center;">
                        <div style="font-weight: 700; text-transform: uppercase;">Drop CUE Sheet</div>
                        <div style="font-size: 0.7rem; color: var(--text-dim);">REKORDBOX .CUE</div>
                    </div>
                </div>
            </div>

            <!-- Studio View: Hidden by default -->
            <div id="studio-view" style="display: none; flex-direction: column; gap: 1rem; width: 100%;">
                
                <!-- Main Content: Waveform and Tracklist -->
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                    
                    <!-- Waveform Section -->
                    <div class="studio-panel" id="waveform-section">
                        <div style="position: relative;">
                            <div id="waveform"></div>
                            <div id="waveform-markers" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden;"></div>
                        </div>
                        <div id="timeline-ruler"></div>
                        <div class="player-controls">
                            <button id="play-btn" class="btn btn-accent"><i data-lucide="play"></i> Play</button>
                            <button id="stop-btn" class="btn"><i data-lucide="square"></i> Stop</button>
                            <button id="tag-btn" class="btn btn-accent"><i data-lucide="plus"></i> Tag Track (T)</button>
                            <div class="flex-grow"></div>
                            <span id="current-time" style="font-family: var(--font-data); color: var(--accent);">00:00:00</span>
                        </div>
                    </div>

                    <!-- Tracklist Section -->
                    <div class="studio-panel" id="tracklist-section">
                        <div class="section-header">
                            <span>Tracklist Editor</span>
                            <div class="flex-row">
                                <button id="sort-btn" class="btn">Sort by Time</button>
                                <button id="clear-btn" class="btn btn-danger">Clear All</button>
                            </div>
                        </div>
                        <div class="scroll-area">
                            <table class="track-table">
                                <thead>
                                    <tr>
                                        <th width="40">#</th>
                                        <th>Artist</th>
                                        <th>Track Name</th>
                                        <th width="120">Start Time</th>
                                        <th width="120">Vibe</th>
                                        <th width="60"></th>
                                    </tr>
                                </thead>
                                <tbody id="tracklist-body">
                                    <!-- Rows generated via JS -->
                                </tbody>
                            </table>
                        </div>
                    <!-- Preview Section -->
                    <div class="studio-panel" id="preview-section" style="display: flex; flex-direction: column;">
                        <div class="section-header" style="background: #333; padding: 0.25rem 1rem;">
                            <div class="flex-row">
                                <button class="preview-tab active" data-preview="yt">YT Chapters</button>
                                <button class="preview-tab" data-preview="vs2">VS2 Playlist</button>
                            </div>
                        </div>
                        <div class="scroll-area preview-container" style="background: #1a1a1a; padding: 1rem; min-height: 800px; max-height: 2000px; overflow-y: auto;">
                            <pre id="preview-content" style="font-family: var(--font-data); font-size: 0.85rem; color: var(--success); white-space: pre-wrap; margin: 0;"></pre>
                        </div>
                        <div id="midi-debug-log" style="display: none; padding: 1rem; background: #000; color: #fff; font-family: var(--font-data); font-size: 0.75rem;"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Hidden Inputs -->
    <input type="file" id="audio-input" accept="audio/*" style="display: none;">
    <input type="file" id="cue-input" accept=".cue" style="display: none;">

    <script src="script.js"></script>
</body>
</html>
